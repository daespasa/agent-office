name: Specification consistency
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  specification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check documentation, contracts and examples
        run: python3 scripts/check_spec.py
